server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/billing/**
    discovery:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://your-auth-server.com/issuer

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
