server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: order
          uri: http://localhost:8081  # Direct to order service
          predicates:
            - Path=/orders/**
        - id: inventory-service
          uri: http://localhost:8082  # Direct to inventory service
          predicates:
            - Path=/inventory/**
        - id: billing-service
          uri: http://localhost:8083  # Direct to billing service
          predicates:
            - Path=/billing/**

  # Temporarily disable discovery
  # discovery:
  #   enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://your-auth-server.com/issuer

