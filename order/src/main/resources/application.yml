server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/korearun5/order-management-config.git
          default-label: main
          clone-on-start: true
          force-pull: true

management:
  endpoints.web.exposure.include: health,info,metrics